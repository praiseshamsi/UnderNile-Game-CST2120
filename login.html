<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UnderNile | Login</title>
    <!--link to styles-->
    <link rel="stylesheet" href="css/styles.css">
    <!--link to javascript-->
    <script src="javascriptfiles/login.js" defer></script>
</head>

<body>
    <header class="header">
        <h2 class="title">UnderNile</h2>
        <!--navigation-->
        <nav class="nav" aria-label="Main navigation">
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="registration.html">Sign Up</a>
            <a href="login.html">Login</a>
        </nav>
    </header>
    <!--login page-->
    <main class="login-page">
        <section class="login-box">
            <h1>Welcome Back</h1>
            <p>Your adventure beneath the Nile awaits.</p>

            <form id="loginForm" novalidate>
                <label for="emailInput">Email Address</label>
                <input
                    type="email"
                    id="emailInput"
                    name="email"
                    placeholder="Enter your email">

                <label for="passwordInput">Password</label>
                <input
                    type="password"
                    id="passwordInput"
                    name="password"
                    placeholder="Enter your password">

                <div id="FeedbackError" aria-live="polite"></div>

                <button class="button" type="submit">Login</button>
            </form>

            <p>
                Don't have an account?
                <a href="registration.html">Sign up here</a>
            </p>
        </section>
    </main>
    <!--footer-->
    <footer class="footer">
        <p>UnderNile | An Underwater Adventure</p>
    </footer>
</body>
</html>
